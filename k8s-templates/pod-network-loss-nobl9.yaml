name: k8s-pod-network-loss
identity: k8spodnetworkloss
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: pod-network-loss-d18
      identity: pod-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: <+input>
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 120
        - name: NETWORK_PACKET_LOSS_PERCENTAGE
          value: <+input>
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
      authEnabled: false
  probes:
    - name: nobl9-slo-probe-nwl1
      identity: nobl9-slo-probe
      isEnterprise: false
      weightage: 10
      duration: 30s
      enableDataCollection: false
      values:
        - name: N9_CLIENT_ID
          value: <+experiment.variables.N9_CLIENT_ID>
        - name: N9_CLIENT_SECRET
          value: <+experiment.variables.N9_CLIENT_SECRET>
        - name: N9_ORG
          value: <+experiment.variables.N9_ORG>
        - name: N9_SLO_NAME
          value: <+experiment.variables.N9_SLO_NAME>
        - name: N9_SLO_PROJECT
          value: <+experiment.variables.N9_SLO_PROJECT>
        - name: N9_SLO_OBJECTIVE
          value: <+experiment.variables.N9_SLO_OBJECTIVE>
        - name: N9_METRIC
          value: <+experiment.variables.N9_METRIC>
        - name: N9_TIMEFRAME
          value: <+experiment.variables.N9_TIMEFRAME>
    - name: nobl9-slo-probe-rqs
      identity: nobl9-slo-probe
      isEnterprise: false
      weightage: 10
      duration: 30s
      enableDataCollection: false
      values:
        - name: N9_CLIENT_ID
          value: <+experiment.variables.N9_CLIENT_ID>
        - name: N9_CLIENT_SECRET
          value: <+experiment.variables.N9_CLIENT_SECRET>
        - name: N9_ORG
          value: <+experiment.variables.N9_ORG>
        - name: N9_SLO_NAME
          value: <+experiment.variables.N9_SLO_NAME>
        - name: N9_SLO_PROJECT
          value: <+experiment.variables.N9_SLO_PROJECT>
        - name: N9_SLO_OBJECTIVE
          value: <+experiment.variables.N9_SLO_OBJECTIVE>
        - name: N9_METRIC
          value: <+experiment.variables.N9_METRIC>
        - name: N9_TIMEFRAME
          value: <+experiment.variables.N9_TIMEFRAME>
  actions:
    - name: k8s-delay-nwl1
      identity: k8s-delay
      isEnterprise: false
      continueOnCompletion: false
      values: []
    - name: k8s-delay-nwl2
      identity: k8s-delay
      isEnterprise: false
      continueOnCompletion: false
      values: []
  vertices:
    - name: v-probe
      start:
        probes:
          - name: nobl9-slo-probe-nwl1
      end: {}
    - name: v-d1
      start:
        actions:
          - name: k8s-delay-nwl1
      end:
        probes:
          - name: nobl9-slo-probe-nwl1
    - name: v-d2o
      start:
        faults:
          - name: pod-network-loss-d18
      end:
        actions:
          - name: k8s-delay-nwl1
    - name: v-d2
      start:
        actions:
          - name: k8s-delay-nwl2
      end:
        faults:
          - name: pod-network-loss-d18
    - name: v-rsl
      start:
        probes:
          - name: nobl9-slo-probe-rqs
      end:
        actions:
          - name: k8s-delay-nwl2
    - name: v-end
      start: {}
      end:
        probes:
          - name: nobl9-slo-probe-rqs
  cleanupPolicy: delete
variables:
  - name: N9_CLIENT_ID
    value: <+input>
    type: String
    required: false
  - name: N9_CLIENT_SECRET
    value: <+input>
    type: String
    required: false
  - name: N9_ORG
    value: <+input>
    type: String
    required: false
  - name: N9_SLO_NAME
    value: <+input>
    type: String
    required: false
  - name: N9_SLO_PROJECT
    value: <+input>
    type: String
    required: false
  - name: N9_SLO_OBJECTIVE
    value: <+input>
    type: String
    required: false
  - name: N9_METRIC
    value: <+input>
    type: String
    required: false
  - name: N9_TIMEFRAME
    value: <+input>
    type: String
    required: false
revision: v1
isDefault: true
