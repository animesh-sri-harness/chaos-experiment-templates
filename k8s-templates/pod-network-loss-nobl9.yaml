name: k8s-pod-network-loss
identity: k8spodnetworkloss
kind: ChaosExperimentTemplate
apiVersion: litmuschaos.io/v1beta1
spec:
  infraType: KubernetesV2
  faults:
    - name: pod-network-loss-d18
      identity: pod-network-loss
      revision: v1
      isEnterprise: true
      values:
        - name: TARGET_WORKLOAD_KIND
          value: <+input>
        - name: TARGET_WORKLOAD_NAMESPACE
          value: <+input>
        - name: TARGET_WORKLOAD_NAMES
          value: <+input>
        - name: TOTAL_CHAOS_DURATION
          value: 300
        - name: NETWORK_PACKET_LOSS_PERCENTAGE
          value: <+input>
        - name: POD_AFFECTED_PERCENTAGE
          value: 100
      authEnabled: false
  probes:
    - name: nobl9-probe-grk
      identity: nobl9-errorbudgetremainingpercentage
      isEnterprise: false
      weightage: 10
      duration: 30s
      enableDataCollection: false
      values: []
    - name: nobl9-probe-ban
      identity: nobl9-errorbudgetremainingpercentage
      isEnterprise: false
      weightage: 10
      duration: 30s
      enableDataCollection: false
      values: []
  actions:
    - name: delay-120s-ijg
      identity: delay-30s
      isEnterprise: false
      continueOnCompletion: false
      values: []
    - name: delay-120s-vng
      identity: delay-30s
      isEnterprise: false
      continueOnCompletion: false
      values: []
  vertices:
    - name: v-gte
      start:
        probes:
          - name: nobl9-probe-grk
      end: {}
    - name: v-ioi
      start:
        actions:
          - name: delay-120s-ijg
      end:
        probes:
          - name: nobl9-probe-grk
    - name: v-d2o
      start:
        faults:
          - name: pod-network-loss-d18
      end:
        actions:
          - name: delay-120s-ijg
    - name: v-vsi
      start:
        actions:
          - name: delay-120s-vng
      end:
        faults:
          - name: pod-network-loss-d18
    - name: v-bc3
      start:
        probes:
          - name: nobl9-probe-ban
      end:
        actions:
          - name: delay-120s-vng
    - name: v-end
      start: {}
      end:
        probes:
          - name: nobl9-probe-ban
  cleanupPolicy: delete
variables:
  - name: N9_SLO_NAME
    value: <+input>
    type: String
    required: false
  - name: N9_SLO_PROJECT
    value: <+input>
    type: String
    required: false
  - name: N9_SLO_OBJECTIVE
    value: <+input>
    type: String
    required: false
revision: v1
isDefault: true
